services:
  website:
    build: .
    image: rettui-website
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      # STATUS_TARGETS: "rns.rettui.dev:4242,front.rns.rettui.dev:4242"
    volumes:
      - status-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  status-data:
