services:
  website:
    build: .
    image: rettui-website
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      # STATUS_TARGETS: "rns.rettui.dev:4242,front.rns.rettui.dev:4242"
      # Node stats (optional, host:port=url pairs; each host must be a target):
      # STATS_URLS: "rns.rettui.dev:4242=https://rns.rettui.dev/stats.json,front.rns.rettui.dev:4242=https://front.rns.rettui.dev/stats.json,back.rns.rettui.dev:4242=https://back.rns.rettui.dev/stats.json,side.rns.rettui.dev:4242=https://side.rns.rettui.dev/stats.json"
      # Or describe the nodes in a YAML file instead (see config.example.yaml). It
      # replaces STATUS_TARGETS and STATS_URLS; setting both is an error.
      # CONFIG_FILE: /config/config.yaml
      # Without a config file, per-node token files: host:port=path (see "Exact peer counts").
      # STATS_TOKEN_FILES: "front.rns.rettui.dev:4242=/config/secrets/front.token"
      # What the page publishes (see "What is public" in the README). Only true or false;
      # an empty value is an error. Not with CONFIG_FILE: set public_details and
      # public_disk_figures in the file instead.
      # PUBLIC_DETAILS: "false"       # no Details view and no /api/stats for any node
      # PUBLIC_DISK_FIGURES: "true"   # exact free and total disk space (default: a level only)
    volumes:
      - status-data:/data
      # - ./config.yaml:/config/config.yaml:ro
      # One token file per node, each readable by the server only (chmod 600). In
      # config.yaml write stats_token_file: secrets/front.token (relative to the config).
      # - ./secrets:/config/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  status-data:
