# Example config for the status page. Set CONFIG_FILE to its path.
# It replaces the STATUS_TARGETS and STATS_URLS environment variables; setting
# both is an error. See "Config file" in README.md.
# Optional: tokens that make the nodes send their peer lists, so a group's peers
# heard is counted exactly (see "Exact peer counts" in README.md). Give each node
# its own token, kept in its own file and not in this one. A relative path is
# relative to this file; with Docker mount the folder next to the config:
#   ./secrets:/config/secrets:ro   (files secrets/front.token, secrets/back.token, ...)
# Remove the # from the stats_token_file lines below once the files exist; a missing
# file stops the server at start.
# Optional privacy settings. A node can override either one.
# public_details: false      # no Details view (and no /api/stats) for the nodes; default true
# public_disk_figures: true  # also show exact free and total disk space; default false,
#                            # when only a level (ok, high, full) and the used share rounded to 5 are shown
nodes:
  # A proxy ("front door"): it passes visitors on to the nodes in proxy_for.
  # The page groups those nodes under it and adds a combined view.
  - address: rns.rettui.dev:4242
    name: Front door
    stats_url: https://rns.rettui.dev/stats.json
    # stats_token_file: secrets/door.token
    proxy_for:
      - front.rns.rettui.dev:4242
      - back.rns.rettui.dev:4242
      - side.rns.rettui.dev:4242
    # Whether the proxy's own numbers are added to the group's (default false).
    # Leave it false if the proxy's stats already include the nodes behind it.
    count_own: false
    # public_details: false

  - address: front.rns.rettui.dev:4242
    name: Front
    stats_url: https://front.rns.rettui.dev/stats.json
    # stats_token_file: secrets/front.token
  - address: back.rns.rettui.dev:4242
    name: Back
    stats_url: https://back.rns.rettui.dev/stats.json
    # stats_token_file: secrets/back.token
  - address: side.rns.rettui.dev:4242
    name: Side
    stats_url: https://side.rns.rettui.dev/stats.json
    # stats_token_file: secrets/side.token
