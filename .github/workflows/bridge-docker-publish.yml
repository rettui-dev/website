name: Publish LXMF bridge image

# Publishes ghcr.io/rettui-dev/lxmf-bridge (bridges/lxmf) from pushes that touch bridges/ and from
# v* tags. Pull requests never publish; CI builds the image for them without pushing.
# Uses only the built-in GITHUB_TOKEN, no other secrets. Tags follow the website image:
#   main        -> main, latest (default branch)
#   dev         -> dev
#   v1.2.3      -> 1.2.3, 1.2, latest
#
# Each platform is built on a runner of its own (no emulation, a Rust build under QEMU is very
# slow), pushed by digest, and a last job joins the two into one multi-platform tag.
# A package created by this workflow is private at first. To make it public, set its visibility
# once under the package settings on GitHub.

on:
  push:
    branches: ["**"]
    # Not applied to tag pushes: a v* tag always publishes.
    paths:
      - "bridges/**"
      - ".github/workflows/bridge-docker-publish.yml"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: bridge-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/rettui-dev/lxmf-bridge

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # rsReticulum and rsLXMF, at the commits rettui pins.
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: bridges/lxmf
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance index, so the two digests join into a plain multi-platform image.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bridge-${{ matrix.runner }}
          cache-to: type=gha,scope=bridge-${{ matrix.runner }},mode=max

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Join platforms and tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$TAGS_JSON")
          # shellcheck disable=SC2046
          docker buildx imagetools create $tag_args $(printf "${IMAGE}@sha256:%s " *)

      - name: Show the result
        env:
          FIRST_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: docker buildx imagetools inspect "$FIRST_TAG"
