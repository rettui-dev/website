<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status - rettui</title>
<meta name="description" content="Reachability of the rettui Reticulum entry points">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="/brand/icon.png">
<link rel="apple-touch-icon" href="/brand/icon.png">
<link rel="stylesheet" href="/site.css">
<script src="/theme.js"></script>
<script src="/status.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img class="wordmark" src="/brand/wordmark.png" alt="rettui" width="91" height="20"></a>
    <nav class="links" aria-label="Site">
      <a href="/">Home</a>
      <a href="/status" aria-current="page">Status</a>
      <a href="https://docs.rettui.dev" rel="noopener noreferrer">Docs</a>
      <a href="https://github.com/rettui-dev" rel="noopener noreferrer">GitHub</a>
    </nav>
    <button id="theme-toggle" type="button">Theme</button>
  </div>
</header>
<main class="wrap">
  <div id="banner" class="banner unknown">
    <h1 id="banner-title" role="status" aria-live="polite">Checking...</h1>
    <p id="banner-sub">Loading the status of the Reticulum entry points.</p>
  </div>
  <noscript><p class="note">The status page needs JavaScript to show the checks.</p></noscript>
  <ul id="hosts" class="hosts"><li class="host loading">Loading entry points...</li></ul>
  <p class="note">Each entry point is checked with a TCP connection every 30 seconds. Open a row for more, or Full details for graphs.</p>
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail-head">
      <h2 id="detail-title">Details</h2>
      <button id="detail-close" type="button">Close</button>
    </div>
    <div id="detail-viewbar" class="viewbar" hidden>
      <label for="detail-view">View</label>
      <select id="detail-view"></select>
    </div>
    <div id="detail-range" class="range" role="group" aria-label="Time range">
      <button type="button" data-range="6h" aria-pressed="false">6 h</button>
      <button type="button" data-range="24h" aria-pressed="true">24 h</button>
      <button type="button" data-range="7d" aria-pressed="false">7 d</button>
    </div>
    <div id="detail-body" class="detail-body" aria-live="polite"></div>
  </dialog>
</main>
<footer>
  <div class="wrap">
    <span>rettui</span>
    <a href="https://docs.rettui.dev" rel="noopener noreferrer">Docs</a>
    <a href="https://github.com/rettui-dev" rel="noopener noreferrer">github.com/rettui-dev</a>
    <a href="https://reticulum.network/" rel="noopener noreferrer">Reticulum</a>
  </div>
</footer>
</body>
</html>
